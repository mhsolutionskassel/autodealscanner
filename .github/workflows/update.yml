name: Aktualisiere Autosuche

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inserate suchen und bewerten
        env:
          KLAZ_API_KEY: ${{ secrets.KLAZ_API_KEY }}
        run: python scanner.py

      - name: Ergebnisse speichern
        run: |
          git config user.name "AutoDealScanner Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/state.json
          git diff --cached --quiet || git commit -m "Aktualisiere Fahrzeugangebote"
          git push
