<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoDealScanner</title><style>body{font:16px system-ui;margin:0;background:#f3f5f8;color:#17202a}header{background:#17202a;color:white;padding:24px}main{max-width:1100px;margin:24px auto;padding:0 16px}.warning,.car,.stat{background:white;padding:16px;border-radius:12px;margin:12px 0;box-shadow:0 2px 10px #0001}.warning{background:#fff7df}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:150px}.stat strong{display:block;font-size:24px}input,select,button{padding:10px;border:1px solid #ccd3dc;border-radius:8px;font:inherit}button{background:#176b87;color:white;border:0;cursor:pointer}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.car{display:flex;justify-content:space-between;gap:15px}.car h3{margin:0 0 8px}.price{font-size:22px;font-weight:bold;white-space:nowrap}.muted{color:#657080;font-size:13px}a{color:#096b8b}@media(max-width:600px){.car{display:block}.price{margin-top:10px}}</style></head><body><header><h1>🚗 AutoDealScanner</h1><div>Gebrauchtwagen-Angebote · Region Kassel</div></header><main><div class="stats"><div class="stat">Angebote<strong id="count">–</strong></div><div class="stat">Gewinnpotenzial ≥ 800 €<strong id="qualified">–</strong></div><div class="stat">Aktualisiert<strong id="updated" style="font-size:16px">–</strong></div></div><div class="warning"><b>Hinweis:</b> Gewinnwerte sind grobe Schätzungen, keine Kaufempfehlung. Fahrzeugzustand, Historie, TÜV und tatsächlicher Marktwert müssen vor dem Kauf geprüft werden.</div><div class="toolbar"><input id="filter" placeholder="Marke/Modell filtern"><select id="sort"><option value="profit">Höchstes Gewinnpotenzial</option><option value="price">Niedrigster Kaufpreis</option><option value="new">Neueste zuerst</option></select><button id="reload">Neu laden</button></div><p id="status" class="muted">Lade Ergebnisse…</p><div id="cards"></div></main><script>let all=[];const eur=n=>Number.isFinite(Number(n))?new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(n)):'–';function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let q=document.querySelector('#filter').value.toLowerCase(),s=document.querySelector('#sort').value,rows=all.filter(x=>(x.title||'').toLowerCase().includes(q));rows.sort((a,b)=>s==='price'?a.price-b.price:s==='new'?(b.created_at||'').localeCompare(a.created_at||''):b.estimated_profit-a.estimated_profit);document.querySelector('#count').textContent=all.length;document.querySelector('#qualified').textContent=all.filter(x=>x.estimated_profit>=800).length;document.querySelector('#cards').innerHTML=rows.map(x=>`<article class="car"><div><h3>${esc(x.title)}</h3><div class="muted">📍 ${esc(x.location)} · ${esc((x.created_at||'').slice(0,10))}</div><p>Vergleichswert: ${eur(x.estimated_market_value)} · Kosten-/Risikopuffer: ${eur(x.cost_reserve)}</p><div class="muted">${esc(x.estimation_note||'Grobe Schätzung')}</div><p><a href="${safeUrl(x.url)}" target="_blank" rel="noopener">Inserat öffnen ↗</a></p></div><div class="price">${eur(x.price)}<br><small>Potenzial ${eur(x.estimated_profit)}</small></div></article>`).join('')||'<div class="car">Keine passenden Angebote in der Ergebnisdatei.</div>'}function safeUrl(v){try{let u=new URL(v);return u.hostname.endsWith('kleinanzeigen.de')?u.href:'#'}catch(e){return '#'}}async function load(){try{let r=await fetch('./data/results.json?t='+Date.now());if(!r.ok)throw Error('Noch keine Ergebnisdatei. Starte den Workflow in GitHub Actions.');let d=await r.json();all=d.ads||[];document.querySelector('#updated').textContent=d.updated_at?new Date(d.updated_at).toLocaleString('de-DE'):'Noch nicht aktualisiert';document.querySelector('#status').textContent=`Suchläufe: ${d.searches_run??'–'} · ${d.note||''}`;render()}catch(e){document.querySelector('#status').textContent=e.message}}document.querySelector('#reload').onclick=load;document.querySelector('#filter').oninput=render;document.querySelector('#sort').onchange=render;load();</script></body></html>
